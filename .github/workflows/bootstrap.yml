name: Bootstrap and build Chibi Companion

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore Android source from bootstrap archive
        run: |
          base64 -d .github/chibi-source.zip.b64 > /tmp/chibi-source.zip
          unzip -q -o /tmp/chibi-source.zip
          cp -a ChibiCompanion/. .
          rm -rf ChibiCompanion
      - name: Commit restored source files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Add native Chibi Companion Android source"
            git push
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.9'
          arguments: assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: chibi-companion-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
