name: Android Debug APK

on:
  push:
    branches: [main, 'miko/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CHIBI_KEYSTORE_BASE64: ${{ secrets.CHIBI_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure preinstalled Android SDK
        run: |
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.9'
          arguments: assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: chibi-companion-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare permanent release signing key
        if: ${{ env.CHIBI_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$CHIBI_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/chibi-release.jks"
          chmod 600 "$RUNNER_TEMP/chibi-release.jks"
      - name: Build permanently signed release APK
        if: ${{ env.CHIBI_KEYSTORE_BASE64 != '' }}
        env:
          CHIBI_STORE_FILE: ${{ runner.temp }}/chibi-release.jks
          CHIBI_STORE_PASSWORD: ${{ secrets.CHIBI_KEYSTORE_PASSWORD }}
          CHIBI_KEY_ALIAS: chibi-release
          CHIBI_KEY_PASSWORD: ${{ secrets.CHIBI_KEYSTORE_PASSWORD }}
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.9'
          arguments: assembleRelease --stacktrace
      - name: Upload permanently signed APK
        if: ${{ env.CHIBI_KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: chibi-companion-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
